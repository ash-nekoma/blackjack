<script>
        const socket = io();

        function formatNumber(num) { return num ? num.toLocaleString() : '0'; }
        function formatInput(el) { let val = el.value.replace(/\D/g, ''); el.value = val ? parseInt(val).toLocaleString() : ''; }

        let currentChipValue = 1000;
        let lastBetAction = null;
        
        function selectChip(val) {
            currentChipValue = val;
            document.querySelectorAll('.casino-chip').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll(`#chip-${val}`).forEach(c => c.classList.add('selected'));
            playSfx('bet');
        }

        window.actRebet = function() {
            if(!lastBetAction) return showToast("No previous bet to repeat.");
            if(lastBetAction.game === 'dice') placeDiceBet(lastBetAction.choice);
            if(lastBetAction.game === 'derby') placeDerbyBet(lastBetAction.choice);
            if(lastBetAction.game === 'color') placeColorBet(lastBetAction.choice);
            if(lastBetAction.game === 'cups') placeCupsBet(lastBetAction.choice);
            if(lastBetAction.game === 'baccarat') placeBaccaratBet(lastBetAction.choice);
            if(lastBetAction.game === 'crash') placeCrashBet();
        }

        window.actUndoBet = function(game) { socket.emit('undo_bet', { username: currentUser.username, game: game }); }

        // --- TRADING HUB ---
        let activeTradeSessionId = null; let myTradeItems = [null, null, null, null, null, null]; let isTradeReady = false; let activeTradeSlot = -1;

        function openTradeHub() { if(!currentUser) return showToast("Log in first!"); socket.emit('req_trade_board'); showModal('trade-hub-modal'); switchTradeTab('live'); }
        function switchTradeTab(tab) { document.getElementById('tab-trade-live').classList.remove('active'); document.getElementById('tab-trade-inv').classList.remove('active'); document.getElementById(`tab-${tab === 'live' ? 'trade-live' : 'trade-inv'}`).classList.add('active'); if(tab === 'live') { document.getElementById('trade-live-view').classList.remove('hidden'); document.getElementById('trade-inv-view').classList.add('hidden'); socket.emit('req_trade_board'); } else { document.getElementById('trade-live-view').classList.add('hidden'); document.getElementById('trade-inv-view').classList.remove('hidden'); renderTradeInventory(); } }
        function renderTradeInventory() { socket.emit('req_market', { username: currentUser.username }); }
        function openTradeInvSelect(idx) { if(isTradeReady) return; activeTradeSlot = idx; document.getElementById('trade-session-modal').classList.add('hidden'); document.getElementById('trade-hub-modal').classList.remove('hidden'); switchTradeTab('inv'); }
        function actCreateTradeOffer(item) { if (activeTradeSessionId) { myTradeItems[activeTradeSlot] = item; activeTradeSlot = -1; hideModal('trade-hub-modal'); showModal('trade-session-modal'); updateMyTradeOffer(); return; } socket.emit('create_trade_offer', { username: currentUser.username, item }); hideModal('trade-hub-modal'); showModal('trade-waiting-modal'); }
        function actCancelTradeOffer() { socket.emit('cancel_trade_offer', { username: currentUser.username }); hideModal('trade-waiting-modal'); openTradeHub(); }
        function actJoinTrade(targetUser) { socket.emit('join_trade', { requester: currentUser.username, target: targetUser }); }

        function updateTradeUI(data) {
            const isHost = data.p1.username === currentUser.username; const me = isHost ? data.p1 : data.p2; const partner = isHost ? data.p2 : data.p1;
            document.getElementById('trade-partner-name').innerText = partner.username; document.getElementById('trade-partner-status').innerText = partner.ready ? 'READY!' : 'CHOOSING ITEMS...'; document.getElementById('trade-partner-status').style.color = partner.ready ? 'var(--success)' : '#94a3b8'; document.getElementById('trade-partner-coins').innerText = `+ ${formatNumber(partner.coins)} Coins`;
            const pItemsContainer = document.getElementById('trade-partner-items-container'); let pItemsHtml = ''; for(let i=0; i<6; i++) { if(partner.items[i]) pItemsHtml += `<div class="trade-item-slot occupied mini" title="${partner.items[i]}">📦</div>`; else pItemsHtml += `<div class="trade-item-slot empty mini">❌</div>`; } pItemsContainer.innerHTML = pItemsHtml;
            const mySlots = document.getElementById('my-trade-slots').children; for(let i=0; i<6; i++) { if(me.items[i]) { mySlots[i].className = 'trade-item-slot occupied'; mySlots[i].innerHTML = '📦'; mySlots[i].title = me.items[i]; } else { mySlots[i].className = 'trade-item-slot empty'; mySlots[i].innerHTML = '❌'; mySlots[i].title = ''; } }
            const myArea = document.getElementById('my-trade-area'); const lockIcon = document.getElementById('trade-lock-icon'); const btnReady = document.getElementById('btn-trade-ready'); const waitingText = document.getElementById('trade-waiting-text'); const coinInput = document.getElementById('trade-my-coins');
            if(me.ready) { myArea.classList.add('locked-trade-area'); lockIcon.classList.remove('hidden'); btnReady.classList.add('hidden'); waitingText.classList.remove('hidden'); coinInput.disabled = true; } else { myArea.classList.remove('locked-trade-area'); lockIcon.classList.add('hidden'); btnReady.classList.remove('hidden'); waitingText.classList.add('hidden'); coinInput.disabled = false; }
        }

        function updateMyTradeOffer() { if(!activeTradeSessionId) return; const coins = parseInt(document.getElementById('trade-my-coins').value) || 0; if(coins > currentUser.credits) { document.getElementById('trade-my-coins').value = currentUser.credits; return showToast("You don't have that many coins."); } if(isTradeReady) toggleTradeReady(); const cleanItems = myTradeItems.filter(i => i !== null); socket.emit('update_trade_offer', { sessionId: activeTradeSessionId, username: currentUser.username, items: cleanItems, coins }); }
        function toggleTradeReady() { if(!activeTradeSessionId) return; socket.emit('set_trade_ready', { sessionId: activeTradeSessionId, username: currentUser.username, ready: true }); }

        socket.on('trade_final_confirm', (data) => {
            const isHost = data.p1.username === currentUser.username; const me = isHost ? data.p1 : data.p2; const partner = isHost ? data.p2 : data.p1;
            let giveHtml = ''; for(let i=0; i<6; i++) { if(me.items[i]) giveHtml += `<div class="mini-confirm-slot occ" title="${me.items[i]}">📦</div>`; else giveHtml += `<div class="mini-confirm-slot"><span style="color:#ef4444;">❌</span></div>`; } document.getElementById('confirm-give-items').innerHTML = giveHtml; document.getElementById('confirm-give-coins').innerText = formatNumber(me.coins);
            let getHtml = ''; for(let i=0; i<6; i++) { if(partner.items[i]) getHtml += `<div class="mini-confirm-slot occ" title="${partner.items[i]}">📦</div>`; else getHtml += `<div class="mini-confirm-slot"><span style="color:#ef4444;">❌</span></div>`; } document.getElementById('confirm-get-items').innerHTML = getHtml; document.getElementById('confirm-get-coins').innerText = formatNumber(partner.coins);
            
            document.getElementById('confirm-partner-info').innerHTML = `USER: ${partner.username.toUpperCase()}<br>JOINED: ${new Date(partner.joined).toLocaleDateString()}`;
            
            const existingOverlay = document.getElementById('trade-confirm-modal').querySelector('.payout-overlay'); if(existingOverlay) existingOverlay.remove(); showModal('trade-confirm-modal');
        });

        function actConfirmFinalTrade() { socket.emit('confirm_final_trade', { sessionId: activeTradeSessionId, username: currentUser.username }); const overlay = document.createElement('div'); overlay.className = 'payout-overlay pixel-text'; overlay.innerText = 'WAITING FOR PARTNER...'; overlay.style.borderRadius = '8px'; document.getElementById('trade-confirm-modal').querySelector('.modal-box').appendChild(overlay); }
        function actCancelFinalTrade() { socket.emit('cancel_final_trade', { sessionId: activeTradeSessionId }); hideModal('trade-confirm-modal'); }
        function actLeaveTrade() { if(!activeTradeSessionId) return; socket.emit('leave_trade', { sessionId: activeTradeSessionId, username: currentUser.username }); }

        // --- GLOBAL CHAT & AUDIO ---
        let currentChatTab = 'room'; let autoMicActive = false; let micPressTime = 0;
        function toggleCommPanel(view) { const panel = document.getElementById('comm-panel'); const notif = document.getElementById('notif-chat'); if(panel.classList.contains('hidden')) { panel.classList.remove('hidden'); if(notif) notif.classList.add('hidden'); document.getElementById('master-chat-input').focus(); } else { panel.classList.add('hidden'); } }
        function switchChatTab(tab) { currentChatTab = tab; document.getElementById('tab-btn-room').classList.remove('active'); document.getElementById('tab-btn-global').classList.remove('active'); document.getElementById(`tab-btn-${tab}`).classList.add('active'); document.getElementById('room-chat-box').classList.add('hidden'); document.getElementById('global-chat-box').classList.add('hidden'); document.getElementById(`${tab}-chat-box`).classList.remove('hidden'); const box = document.getElementById(`${tab}-chat-box`); box.scrollTop = box.scrollHeight; }

        window.actSendMasterChat = function() { const input = document.getElementById('master-chat-input'); const msg = input.value.trim(); if(msg && currentUser) { if (currentChatTab === 'global') { const allRooms = ['3seat', '5seat', 'dice', 'derby', 'color', 'pvp', 'cups', 'crash', 'baccarat']; allRooms.forEach(r => socket.emit('send_chat', { roomId: r, username: currentUser.username, message: '[GLOBAL] ' + msg })); } else { if(!currentRoomId) return showToast("You are not in a room."); socket.emit('send_chat', { roomId: currentRoomId, username: currentUser.username, message: msg }); } input.value = ''; } }
        document.getElementById('master-chat-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') actSendMasterChat(); });

        function showToast(msg, type = 'error') { const container = document.getElementById('toast-container'); container.innerHTML = ''; const toast = document.createElement('div'); toast.className = `toast toast-${type} pixel-text`; toast.innerText = msg; container.appendChild(toast); setTimeout(() => { toast.classList.add('fade-out'); setTimeout(() => toast.remove(), 300); }, 3000); }

        let confirmActionCallback = null; function showConfirm(msg, callback) { document.getElementById('confirm-action-msg').innerText = msg; confirmActionCallback = callback; showModal('logout-modal'); }
        document.getElementById('btn-confirm-yes').addEventListener('click', () => { if(confirmActionCallback) confirmActionCallback(); hideModal('logout-modal'); });
        function promptLogout() { showConfirm("Are you sure you want to log out?", () => logout()); }

        let currentUser = null; let currentGameState = null; let currentRoomId = null; let mySeatIndex = -1;
        let globalTimerInt = null; let nextRoundTimerInt = null; let idleTimerInt = null; let turnTimerVisualInt = null;
        let rewardTimerInt = null; let actionLocked = false; window.lastBetAmount = 0; let pendingBankAction = null; 
        let rewardCooldownSeconds = 0; let unreadNotifs = 0; let gameLocks = {}; let currentOpenTicketId = null; let currentInboxTab = 'announcement'; let allMyTickets = [];
        let myDiceBets = { under: 0, seven: 0, over: 0 }; let myDerbyBets = [0, 0, 0, 0, 0, 0]; let myColorBets = { red: 0, blue: 0, yellow: 0, green: 0, pink: 0, white: 0 };
        let myCupsBets = [0, 0, 0]; let myBaccaratBets = { player: 0, banker: 0, tie: 0 }; let currentCupsBetChoice = -1; let currentPvpDuelState = null; let myDuelSeatIndex = -1;
        let isBetting = false; let betThrottleTimeout = null;

        const audioNodes = { bgm: document.getElementById('sfx-bgm'), deal: document.getElementById('sfx-deal'), bet: document.getElementById('sfx-bet'), win: document.getElementById('sfx-win'), lose: document.getElementById('sfx-lose') };
        audioNodes.bgm.volume = 0; function updateVol(type, val) { if (type === 'bgm') { audioNodes.bgm.volume = val; if(val > 0 && audioNodes.bgm.paused) audioNodes.bgm.play().catch(()=>{}); } else { ['deal', 'bet', 'win', 'lose'].forEach(id => { if(audioNodes[id]) audioNodes[id].volume = val; }); } }
        function playSfx(id) { if(audioNodes[id] && audioNodes[id].volume > 0) { audioNodes[id].currentTime = 0; audioNodes[id].play().catch(()=>{}); } }

        let mediaRecorder = null; let audioChunks = [];
        window.handleMicDown = function() { if(!currentRoomId) return; micPressTime = Date.now(); if(!autoMicActive && mediaRecorder && mediaRecorder.state === 'inactive') { audioChunks = []; mediaRecorder.start(); document.getElementById('master-mic-toggle').style.background = 'var(--success)'; } };
        window.handleMicUp = function() { if(!currentRoomId) return; let heldTime = Date.now() - micPressTime; if(heldTime < 250) { autoMicActive = !autoMicActive; if(autoMicActive) { document.getElementById('master-mic-toggle').style.background = 'var(--danger)'; showToast("Automatic Mic ENABLED", "warning"); if(mediaRecorder && mediaRecorder.state === 'inactive') mediaRecorder.start(1500); } else { document.getElementById('master-mic-toggle').style.background = '#555'; showToast("Automatic Mic DISABLED", "warning"); if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } } else { if(!autoMicActive) { document.getElementById('master-mic-toggle').style.background = '#555'; if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } } };
        
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => { if(e.data.size > 0) { audioChunks.push(e.data); if(autoMicActive && audioChunks.length > 0 && currentRoomId) { socket.emit('voice_message', { room: currentRoomId.startsWith('arcade_') ? currentRoomId : currentRoomId, audio: new Blob(audioChunks, { type: 'audio/webm' }) }); audioChunks = []; } } };
            mediaRecorder.onstop = () => { if(audioChunks.length > 0 && currentRoomId && !autoMicActive) { socket.emit('voice_message', { room: currentRoomId.startsWith('arcade_') ? currentRoomId : currentRoomId, audio: new Blob(audioChunks, { type: 'audio/webm' }) }); } audioChunks = []; };
        }).catch(err => console.log("Microphone access denied."));

        socket.on('voice_broadcast', data => { try { const audioUrl = URL.createObjectURL(new Blob([data.audio], { type: 'audio/webm' })); new Audio(audioUrl).play(); showToast(`🎤 ${data.username} is speaking...`, 'success'); } catch(e) {} });

        socket.on('receive_chat', data => { 
            const isGlobal = data.message.startsWith('[GLOBAL] '); const cleanMsg = isGlobal ? data.message.substring(9) : data.message;
            const globalBox = document.getElementById('global-chat-box'); if(globalBox) { globalBox.innerHTML += `<div style="margin-bottom: 8px;"><span style="color:${isGlobal ? 'var(--warning)' : 'var(--accent-glow-2)'}; font-weight:bold;">${data.username} ${isGlobal ? '(Global)' : ''}:</span> <span>${cleanMsg}</span></div>`; globalBox.scrollTop = globalBox.scrollHeight; }
            if(!isGlobal) { const roomBox = document.getElementById('room-chat-box'); if(roomBox) { roomBox.innerHTML += `<div style="margin-bottom: 8px;"><span style="color:var(--accent-glow-2); font-weight:bold;">${data.username}:</span> <span>${cleanMsg}</span></div>`; roomBox.scrollTop = roomBox.scrollHeight; } }
            const panel = document.getElementById('comm-panel'); const notif = document.getElementById('notif-chat'); if(panel && panel.classList.contains('hidden') && notif) { notif.classList.remove('hidden'); }
        });

        socket.on('chat_wiped', () => { document.getElementById('room-chat-box').innerHTML = `<div style="color:var(--danger); text-align:center; margin-top:20px;">[CHAT CLEARED BY ADMIN]</div>`; });

        socket.on('trade_board_update', (offers) => {
            const list = document.getElementById('active-trade-offers-list');
            if(offers.length === 0) { list.innerHTML = '<div class="pixel-text" style="color:#64748b; font-size:28px; text-align:center; margin-top:20px;">No active trade offers.</div>'; return; }
            list.innerHTML = offers.map(o => `<div class="trade-offer-card"><div><div class="pixel-text" style="font-size: 28px; color: var(--accent-glow-2);">${o.username}</div><div class="pixel-text" style="font-size: 20px; color: #fff;">Offering: ${o.item.toUpperCase()}</div></div>${o.username !== currentUser.username ? `<button class="mc-btn small" style="background:var(--success); color:#000;" onclick="actJoinTrade('${o.username}')">TRADE</button>` : `<div class="pixel-text" style="color:var(--warning);">YOUR OFFER</div>`}</div>`).join('');
        });

        // --- INITIALIZATION ---
        window.onload = () => { 
            try { 
                const savedU = localStorage.getItem('cr_user'); 
                const savedP = localStorage.getItem('cr_pass'); 
                if(savedU && savedP) { 
                    document.getElementById('login-user').value = savedU; 
                    document.getElementById('login-pass').value = savedP; 
                    login(); 
                } 
            } catch(e){} 
        };

        // --- AUTH LOGIC (FIXED) ---
        function toggleAuth(panel) { document.getElementById('panel-login').classList.toggle('hidden', panel !== 'login'); document.getElementById('panel-signup').classList.toggle('hidden', panel !== 'signup'); }

        async function signup() {
            try {
                const u = document.getElementById('signup-user').value.trim(); const p = document.getElementById('signup-pass').value.trim();
                if(!u || !p) return showToast("Enter credentials."); if(!document.getElementById('tos-checkbox').checked) return showToast("Must accept terms.");
                const res = await fetch(`/api/signup`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
                const data = await res.json(); 
                if(res.ok) { 
                    showToast("REQUEST SENT! PENDING APPROVAL.", "success"); 
                    setTimeout(() => toggleAuth('login'), 3500); 
                } else { 
                    showToast(data.error); 
                }
            } catch(e) { 
                console.error("Signup Fetch Error:", e); 
                showToast("NETWORK ERROR: Backend API unreachable."); 
            }
        }

        async function login() {
            try {
                const u = document.getElementById('login-user').value.trim(); const p = document.getElementById('login-pass').value.trim();
                if(!u || !p) return showToast("Enter credentials.");
                
                const res = await fetch(`/api/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
                const data = await res.json();
                
                if(res.ok) {
                    currentUser = data; 
                    try { localStorage.setItem('cr_user', u); localStorage.setItem('cr_pass', p); } catch(e) {}
                    document.getElementById('auth-view').classList.add('hidden'); document.getElementById('main-menu-view').classList.remove('hidden');
                    updateAllCredits(); rewardCooldownSeconds = data.cooldownSeconds; 
                    const userPreview = document.getElementById('profile-username-preview'); if(userPreview) userPreview.innerText = currentUser.username;
                    playSfx('deal'); socket.emit('req_inbox', { username: currentUser.username }); 
                } else { 
                    showToast(data.error); 
                }
            } catch(e) { 
                console.error("Login Fetch Error:", e); 
                showToast("NETWORK ERROR: Backend API unreachable."); 
            }
        }

        // --- DASHBOARD MENUS ---
        const originalMarketDataHandler = socket._callbacks['market_data'];
        socket.on('market_data', (data) => {
            if(!document.getElementById('trade-hub-modal').classList.contains('hidden')) { let counts = {}; data.inventory.forEach(i => counts[i] = (counts[i] || 0) + 1); document.getElementById('trade-inventory-grid').innerHTML = Object.keys(counts).map(item => `<div class="trade-inventory-item pixel-text" onclick="actCreateTradeOffer('${item}')">📦 <div class="qty">${counts[item]}</div></div>`).join(''); }
            const auctionList = document.getElementById('market-auctions-list');
            if(auctionList) {
                if(data.auctions.length === 0) { auctionList.innerHTML = '<div style="color: #64748b; font-size: 28px; text-align: center; margin-top: 20px;">MARKET IS EMPTY</div>'; } 
                else { auctionList.innerHTML = data.auctions.map(a => `<div class="market-item"><div><div class="market-title pixel-text">${a.item.toUpperCase()}</div><div class="market-desc pixel-text">Seller: ${a.seller} | Bid: ${a.highestBidder || 'None'}</div></div><div style="text-align: right;"><div class="pixel-text" style="color: var(--success); font-size: 24px; font-weight: bold;">${formatNumber(a.currentBid)} CR</div><div class="pixel-text" style="color: #ccc; font-size: 18px; margin-bottom: 5px;">${Math.max(0, Math.floor((a.endTime - Date.now()) / 1000))}s left</div><button class="mc-btn small" style="background: var(--accent-glow-2);" onclick="promptBid('${a.id}', ${a.currentBid})">BID</button></div></div>`).join(''); }
                const invList = document.getElementById('market-inventory-list');
                if(data.inventory.length === 0) { invList.innerHTML = '<div style="color: #64748b; font-size: 28px; text-align: center; margin-top: 20px;">INVENTORY EMPTY</div>'; } 
                else { let counts = {}; data.inventory.forEach(i => counts[i] = (counts[i] || 0) + 1); invList.innerHTML = Object.keys(counts).map(item => `<div class="market-item"><div class="market-title pixel-text">${item.toUpperCase()} <span style="color:#fff;">(x${counts[item]})</span></div><button class="mc-btn small" style="background: var(--success); color:#000;" onclick="setupAuction('${item}')">SELL</button></div>`).join(''); }
            }
        });

        function showModal(id) { if(!currentUser && id !== 'how-to-play-modal' && id !== 'tos-modal') return showToast("Please log in first."); if(id !== 'table-modal' && id !== 'arcade-modal') { document.querySelectorAll('.overlay-menu').forEach(m => m.classList.add('hidden')); } if(id === 'table-modal' || id === 'arcade-modal') { document.getElementById('play-category-modal').classList.add('hidden'); } const el = document.getElementById(id); if(el) el.classList.remove('hidden'); }
        function hideModal(id) { const el = document.getElementById(id); if(el) el.classList.add('hidden'); }
        function showProfile() { if(!currentUser) return showToast("Please log in first!"); document.getElementById('profile-username-preview').innerText = currentUser.username.toUpperCase(); document.getElementById('profile-credits-preview').innerText = formatNumber(currentUser.credits); showModal('profile-modal'); }
        function showBank() { if(!currentUser) return showToast("Please log in first!"); document.getElementById('bank-balance-display').innerText = formatNumber(currentUser.credits); document.getElementById('bank-amount').value = ''; showModal('bank-modal'); }
        function showRewards() { if(!currentUser) return showToast("Please log in first!"); showModal('reward-modal'); if(rewardCooldownSeconds > 0) { document.getElementById('reward-active-view').classList.add('hidden'); document.getElementById('reward-cooldown-view').classList.remove('hidden'); clearInterval(rewardTimerInt); let left = rewardCooldownSeconds; rewardTimerInt = setInterval(() => { left--; if(left <= 0) { clearInterval(rewardTimerInt); rewardCooldownSeconds = 0; document.getElementById('reward-active-view').classList.remove('hidden'); document.getElementById('reward-cooldown-view').classList.add('hidden'); } else { document.getElementById('reward-timer').innerText = `${Math.floor(left / 3600).toString().padStart(2, '0')}:${Math.floor((left % 3600) / 60).toString().padStart(2, '0')}:${(left % 60).toString().padStart(2, '0')}`; } }, 1000); } else { document.getElementById('reward-active-view').classList.remove('hidden'); document.getElementById('reward-cooldown-view').classList.add('hidden'); } }

        async function openProfileLedger() { if(!currentUser) return; const res = await fetch(`/api/profile/ledger/` + currentUser.username); if(res.ok) { const data = await res.json(); document.getElementById('ledger-list').innerHTML = data.length ? data.map(tx => `<div style="margin-bottom:10px; border-bottom: 2px dashed #333; padding-bottom: 5px;"><div style="color:var(--warning); font-size:24px;">${tx.type}</div><div style="font-size:20px; color:#fff;">Amt: ${formatNumber(tx.amount)} CR | Date: ${new Date(tx.date).toLocaleDateString()}</div></div>`).join('') : '<div style="color:#aaa;">No transactions on record.</div>'; hideModal('profile-modal'); showModal('profile-ledger-modal'); } }
        async function openBankLedger() { if(!currentUser) return; const res = await fetch(`/api/profile/ledger/` + currentUser.username); if(res.ok) { const data = await res.json(); const bankTxs = data.filter(tx => tx.type.includes('BANK')); document.getElementById('bank-ledger-list').innerHTML = bankTxs.length ? bankTxs.map(tx => `<div style="margin-bottom:10px; border-bottom: 2px dashed #333; padding-bottom: 5px;"><div style="color:var(--warning); font-size:24px;">${tx.type}</div><div style="font-size:20px; color:#fff;">Amt: ${formatNumber(tx.amount)} CR | Status: <span style="color:${tx.status==='completed'?'var(--success)':'var(--warning)'}">${tx.status.toUpperCase()}</span></div></div>`).join('') : '<div style="color:#aaa;">No bank requests found.</div>'; hideModal('bank-modal'); showModal('bank-ledger-modal'); } }

        function showBankConfirm(type) { const amt = parseInt(document.getElementById('bank-amount').value.replace(/,/g, '')); if(isNaN(amt) || amt <= 0) return showToast("Enter a valid amount."); if (type === 'deposit') { if (amt < 10000 || amt > 100000) return showToast('Deposit Limits: 10k - 100k.'); } else if (type === 'withdrawal') { if (amt < 50000 || amt > 100000) return showToast('Withdrawal Limits: 50k - 100k.'); if (amt > currentUser.credits) return showToast('Insufficient funds for this withdrawal.'); } pendingBankAction = { type, amount: amt }; document.getElementById('confirm-bank-type').innerText = type.toUpperCase(); document.getElementById('confirm-bank-amt').innerText = formatNumber(amt); hideModal('bank-modal'); showModal('bank-confirm-modal'); }
        async function executeBankRequest() { if(!pendingBankAction) return; const res = await fetch(`/api/bank/request`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username: currentUser.username, type: pendingBankAction.type, amount: pendingBankAction.amount}) }); const data = await res.json(); if(res.ok) { showToast("Request submitted successfully to Administration.", "success"); if(data.newCredits !== undefined) { currentUser.credits = data.newCredits; updateAllCredits(); } hideModal('bank-confirm-modal'); pendingBankAction = null; } else { showToast(data.error); } }

vent)">DEL</button>` : `<span class="pixel-text" style="font-size:20px; color:#94a3b8;">${date} ${time}</span>`}</div><div class="pixel-text" style="font-size:22px; color:#94a3b8;">${lastMsg}</div></div>`; }).join(''); }

            else if (game === 'baccarat') { if (Object.values(myBaccaratBets).reduce((a,b)=>a+b, 0) > 0) return showToast("You cannot leave while you have active bets!"); }

        function formatCardHTML(c, isHidden) { if (isHidden) return `<div class="card dealer-hidden"></div>`; const colorClass = ['Hearts', 'Diamonds'].includes(c.suit) ? 'red' : 'black'; const suitSym = {'Hearts':'♥', 'Diamonds':'♦', 'Clubs':'♣', 'Spades':'♠'}[c.suit]; return `<div class="card ${colorClass}"><div class="card-corner top-left">${c.value}<br>${suitSym}</div><div class="card-center-suit">${suitSym}</div><div class="card-corner bottom-right">${c.value}<br>${suitSym}</div></div>`; }

            if(currentGameState && currentGameState.status === 'betting' && state.status === 'playing') playSfx('deal');
            actionLocked = false; currentGameState = state; 
            if(currentUser && currentRoomId && !document.getElementById('game-interface').classList.contains('hidden')) {

        function calculateValue(cards) { let val = 0; let aces = 0; cards.forEach(c => { val += c.weight; if(c.value==='A') aces++; }); while(val > 21 && aces > 0) { val -= 10; aces--; } return val; }

        function renderTable(state) {
            if (!state) return; document.getElementById('phase-display').innerText = state.status === 'resolving' ? 'RESULTS' : state.status.toUpperCase();
            const dCards = document.getElementById('dealer-cards'); dCards.innerHTML = ''; const dBadge = document.getElementById('dealer-val');
            state.dealerCards.forEach(c => { dCards.innerHTML += formatCardHTML(c, c.hidden); }); const visibleDealerCards = state.dealerCards.filter(c => !c.hidden);
            if (visibleDealerCards.length > 0) { dBadge.innerText = calculateValue(visibleDealerCards); dBadge.classList.remove('hidden'); } else { dBadge.classList.add('hidden'); }

            const seatsArea = document.getElementById('seats-area');
            let activeElements = [];

                statusText.innerText = "SHUFFLING..."; timerText.innerText = "NO MORE BETS"; myCupsBets = [0,0,0]; currentCupsBetChoice = -1; playSfx('deal'); document.querySelectorAll('.cup-wrapper').forEach(w => w.classList.remove('reveal'));
                document.querySelectorAll('.bet-badge').forEach(b => { if(b.id.includes('cups')) { b.classList.add('hidden'); b.style.backgroundColor = 'var(--accent-glow-2)'; }});
                clearInterval(shuffleAnim);
                shuffleAnim = setInterval(() => { let posArr = [0, 1, 2].sort(() => Math.random() - 0.5); document.getElementById('cup-wrap-0').style.left = (posArr[0] * 33.33) + '%'; document.getElementById('cup-wrap-1').style.left = (posArr[1] * 33.33) + '%'; document.getElementById('cup-wrap-2').style.left = (posArr[2] * 33.33) + '%'; finalCupPositions = posArr; }, 200);
            }
            else if (data.status === 'betting') { clearInterval(shuffleAnim); statusText.innerText = "WHERE IS THE BALL?"; clearInterval(cupsInterval); cupsInterval = setInterval(() => { let left = Math.max(0, Math.floor((data.betEndTime - Date.now()) / 1000)); timerText.innerText = `${left}s REMAINING`; if (left <= 0) clearInterval(cupsInterval); }, 1000); }
            else if (data.status === 'resolving') {
                clearInterval(shuffleAnim);
                setTimeout(() => {
                    const winCupWrap = document.getElementById(`cup-wrap-${data.winningCup}`); if(winCupWrap) winCupWrap.classList.add('reveal');
                    let visualWinPosition = finalCupPositions[data.winningCup] + 1; statusText.innerText = `CUP ${visualWinPosition} HAS THE BALL!`;
                    let totalCupsBet = myCupsBets.reduce((a,b)=>a+b, 0);
                    if (totalCupsBet > 0) {
                        let myWins = data.winners.filter(w => w.username.toLowerCase() === currentUser.username.toLowerCase());
                        if (myWins.length > 0) { let totalWin = myWins.reduce((sum, w)=>sum+w.amount, 0); timerText.innerText = `YOU WON ${formatNumber(totalWin)}!`; playSfx('win'); } else { timerText.innerText = "HOUSE WINS"; playSfx('lose'); }
                        for(let i=0; i<3; i++) {
                            if(myCupsBets[i] > 0) {
                                let uiPos = finalCupPositions[i]; const badge = document.getElementById(`badge-cups-${uiPos}`); let winData = myWins.find(w=>w.choice===i);
                                if(winData) { badge.innerText = formatNumber(winData.amount); badge.style.backgroundColor = 'var(--success)'; } else { badge.innerText = "0"; badge.style.backgroundColor = 'var(--danger)'; }
                            }
                        }
                    }
                }, 500);
            }
        });

        window.placeCupsBet = function(uiPosition) {
            if(gameLocks.cups) return showToast('This game is offline for maintenance.');
            if(isBetting) return; let actualCupChoiceId = finalCupPositions.indexOf(uiPosition);
            if(currentCupsBetChoice !== -1 && currentCupsBetChoice !== actualCupChoiceId) return showToast('You can only bet on ONE cup per round!');
            const box = document.getElementById(`cups-btn-${uiPosition}`); if(box && box.classList.contains('locked')) return;
            const amt = currentChipValue;
            if (isNaN(amt) || amt <= 0) return showToast("Select a valid bet amount."); 
            if (myCupsBets[actualCupChoiceId] + amt > 50000) return showToast("Maximum limit is 50,000 per cup!"); if (amt > currentUser.credits) return showToast("Insufficient credits!");
            
            applyThrottle(); currentCupsBetChoice = actualCupChoiceId; myCupsBets[actualCupChoiceId] += amt; socket.emit('place_cups_bet', { username: currentUser.username, choice: actualCupChoiceId, amount: amt }); lastBetAction = { game: 'cups', choice: uiPosition };
        };

        // --- COLOR GAME LOGIC ---
        let colorInterval = null; let colorAnimInterval = null; const PERYA_COLORS = ['red', 'blue', 'yellow', 'green', 'pink', 'white'];
        socket.on('color_state_update', (data) => {
            const statusText = document.getElementById('color-result-text'); const timerText = document.getElementById('color-timer');
            const d1 = document.getElementById('col-die1'); const d2 = document.getElementById('col-die2'); const d3 = document.getElementById('col-die3');
            
            if (data.status === 'betting') {
                statusText.innerText = "PLACE YOUR BETS"; myColorBets = { red: 0, blue: 0, yellow: 0, green: 0, pink: 0, white: 0 }; d1.classList.remove('shake'); d2.classList.remove('shake'); d3.classList.remove('shake'); clearInterval(colorInterval);
                document.querySelectorAll('.bet-badge').forEach(b => { if(b.id.includes('color') || b.id.includes('badge-red') || b.id.includes('badge-blue') || b.id.includes('badge-yellow') || b.id.includes('badge-green') || b.id.includes('badge-pink') || b.id.includes('badge-white')) { b.classList.add('hidden'); b.style.backgroundColor = 'var(--accent-glow-2)'; }});
                colorInterval = setInterval(() => { let left = Math.max(0, Math.floor((data.betEndTime - Date.now()) / 1000)); timerText.innerText = `${left}s REMAINING`; if (left <= 0) clearInterval(colorInterval); }, 1000);
            }
            else if (data.status === 'rolling') { 
                statusText.innerText = "ROLLING..."; timerText.innerText = "NO MORE BETS"; d1.classList.add('shake'); d2.classList.add('shake'); d3.classList.add('shake'); playSfx('deal'); 
                clearInterval(colorAnimInterval);
                colorAnimInterval = setInterval(()=>{
                    d1.className = `color-die shake bg-${PERYA_COLORS[Math.floor(Math.random()*6)]}`; d2.className = `color-die shake bg-${PERYA_COLORS[Math.floor(Math.random()*6)]}`; d3.className = `color-die shake bg-${PERYA_COLORS[Math.floor(Math.random()*6)]}`;
                }, 100);
            }
            else if (data.status === 'resolving') {
                clearInterval(colorAnimInterval); d1.classList.remove('shake'); d2.classList.remove('shake'); d3.classList.remove('shake');
                setTimeout(()=> { d1.className = `color-die bg-${data.dice[0]}`; }, 100);
                setTimeout(()=> { d2.className = `color-die bg-${data.dice[1]}`; }, 300);
                setTimeout(()=> { d3.className = `color-die bg-${data.dice[2]}`; statusText.innerText = "RESULT!"; }, 500);
                
                setTimeout(() => {
                    let totalColorBet = Object.values(myColorBets).reduce((a,b)=>a+b, 0);
                    if (totalColorBet > 0) {
                        let myWins = data.winners.filter(w => w.username.toLowerCase() === currentUser.username.toLowerCase());
                        if (myWins.length > 0) { let totalWin = myWins.reduce((sum, w)=>sum+w.amount, 0); timerText.innerText = `YOU WON ${formatNumber(totalWin)}!`; playSfx('win'); } else { timerText.innerText = "HOUSE WINS"; playSfx('lose'); }
                        ['red', 'blue', 'yellow', 'green', 'pink', 'white'].forEach(c => { 
                            if(myColorBets[c] > 0) {
                                const badge = document.getElementById(`badge-${c}`); let winData = myWins.find(w=>w.choice===c);
                                if(winData) { badge.innerText = formatNumber(winData.amount); badge.style.backgroundColor = 'var(--success)'; } 
                                else { badge.innerText = "0"; badge.style.backgroundColor = 'var(--danger)'; }
                            }
                        });
                    }
                }, 600);
            }
        });

        window.placeColorBet = function(choice) {
            if(gameLocks.color) return showToast('This game is offline for maintenance.');
            if(isBetting) return; const box = document.getElementById(`color-btn-${choice}`); if(box && box.classList.contains('locked')) return;
            const amt = currentChipValue;
            if (isNaN(amt) || amt <= 0) return showToast("Select a valid bet amount."); 
            if (myColorBets[choice] + amt > 50000) return showToast("Maximum limit is 50,000 per color!"); if (amt > currentUser.credits) return showToast("Insufficient credits!");
            
            applyThrottle(); myColorBets[choice] += amt; socket.emit('place_color_bet', { username: currentUser.username, choice, amount: amt }); 
            lastBetAction = { game: 'color', choice: choice };
        };

        // --- PVP LOGIC ---
        window.joinPvpSeat = function(index) { if(!currentUser) return; socket.emit('join_pvp_seat', { username: currentUser.username, seatIndex: index }); };
        window.leavePvpSeat = function() { if(myDuelSeatIndex !== -1 && currentUser) { socket.emit('leave_pvp_seat', { username: currentUser.username, seatIndex: myDuelSeatIndex }); } };
        socket.on('open_pvp_host_modal', () => { showModal('pvp-host-modal'); });
        window.toggleModalWheelConfig = function() {
            const type = document.getElementById('modal-duel-type').value;
            if(type === 'wheel') { document.getElementById('modal-wheel-config-row').classList.remove('hidden'); document.getElementById('coin-config-row').classList.add('hidden'); }
            else if(type === 'coin') { document.getElementById('modal-wheel-config-row').classList.add('hidden'); document.getElementById('coin-config-row').classList.remove('hidden'); }
            else { document.getElementById('modal-wheel-config-row').classList.add('hidden'); document.getElementById('coin-config-row').classList.add('hidden'); } 
        };

        window.submitPvpHostConfig = function() {
            const type = document.getElementById('modal-duel-type').value;
            const format = parseInt(document.getElementById('modal-duel-format').value);
            const betAmount = parseInt(document.getElementById('modal-duel-bet').value);
            const slices = type === 'wheel' ? parseInt(document.getElementById('modal-duel-wheel-slices').value) : 2;
            const hostChoice = type === 'coin' ? document.getElementById('duel-host-choice').value : currentUser.username;
            if (betAmount > currentUser.credits) { return showToast("You have insufficient credits for this wager."); }
            socket.emit('host_pvp_match', { username: currentUser.username, type, format, betAmount, slices, hostChoice });
            hideModal('pvp-host-modal');
        };

        socket.on('open_pvp_accept_modal', (data) => {
            document.getElementById('accept-host-name').innerText = data.hostName.toUpperCase();
            document.getElementById('accept-game-type').innerText = data.type === 'wheel' ? `WHEEL SPIN (${data.slices} Slices)` : (data.type === 'coin' ? 'COIN FLIP' : 'ROCK PAPER SCISSORS');
            document.getElementById('accept-format').innerText = data.format === 1 ? '1 ROUND' : `FIRST TO ${data.format}`;
            document.getElementById('accept-wager').innerText = data.betAmount === 0 ? 'ITEM WAGER (0 CR)' : `${formatNumber(data.betAmount)} CR`;
            showModal('pvp-accept-modal');
        });

        window.acceptPvpDuel = function() { socket.emit('accept_pvp_duel', { username: currentUser.username }); hideModal('pvp-accept-modal'); };
        window.declinePvpDuel = function() { hideModal('pvp-accept-modal'); leavePvpSeat(); };
        window.actPvpPick = function(pick) { socket.emit('pvp_rps_pick', { username: currentUser.username, pick }); };

        socket.on('pvp_duel_state_update', (state) => {
            currentPvpDuelState = state;
            const statusBox = document.getElementById('duel-status-box');
            statusBox.innerText = state.message;

            const mySeatData = state.seats.find(s => s && s.username.toLowerCase() === currentUser.username.toLowerCase());
            myDuelSeatIndex = mySeatData ? state.seats.indexOf(mySeatData) : -1;

            if (state.type === 'rps' && state.status === 'waiting_picks' && myDuelSeatIndex !== -1 && !state.seats[myDuelSeatIndex].rpsChoice) { 
                document.getElementById('duel-rps-controls').classList.remove('hidden'); 
            } else { 
                document.getElementById('duel-rps-controls').classList.add('hidden'); 
            }

            for(let i=0; i<2; i++) {
                const seat = state.seats[i];
                const emptyUI = document.getElementById(`duel-empty-${i}`);
                const occUI = document.getElementById(`duel-occupied-${i}`);
                const seatCard = document.getElementById(`duel-seat-${i}`);

                if(seat) {
                    emptyUI.classList.add('hidden'); occUI.classList.remove('hidden');
                    document.getElementById(`duel-name-${i}`).innerText = seat.username.toUpperCase();
                    document.getElementById(`duel-name-${i}`).style.color = seat.color || '#fff';
                    document.getElementById(`duel-score-${i}`).innerText = seat.score;
                    
                    let displayChoice = seat.choice ? seat.choice.toUpperCase() : 'WAITING...';
                    if(state.type === 'rps') {
                        if (seat.rpsChoice) displayChoice = myDuelSeatIndex === i ? seat.rpsChoice.toUpperCase() : 'LOCKED IN';
                        else displayChoice = 'THINKING...';
                    }
                    document.getElementById(`duel-choice-${i}`).innerText = displayChoice;
                    
                    const readyBadge = document.getElementById(`duel-ready-${i}`);
                    if(seat.ready) readyBadge.classList.remove('hidden'); else readyBadge.classList.add('hidden');

                    if(myDuelSeatIndex === i) seatCard.classList.add('my-seat'); else seatCard.classList.remove('my-seat');
                } else {
                    emptyUI.classList.remove('hidden'); occUI.classList.add('hidden'); seatCard.classList.remove('my-seat');
                    document.getElementById(`duel-ready-${i}`).classList.add('hidden');
                }
            }

            const matchVisual = document.getElementById('duel-match-visual');
            const pointer = document.getElementById('duel-wheel-pointer');
            const canvas = document.getElementById('duel-wheel-canvas');
            
            if(state.status === 'flipping' || state.status === 'spinning') {
                if (state.type === 'wheel') { matchVisual.classList.add('hidden'); canvas.classList.remove('hidden'); canvas.classList.add('wheel-spinning'); pointer.classList.remove('hidden'); drawWheel(canvas, state.slices, state.seats[0].username, state.seats[1].username); } 
                else { canvas.classList.add('hidden'); matchVisual.classList.remove('hidden'); matchVisual.className = 'duel-coin flipping'; matchVisual.innerText = '?'; pointer.classList.add('hidden'); }
            } else if (state.status === 'resolving' || state.status === 'finished') {
                if (state.type === 'wheel') { matchVisual.classList.add('hidden'); canvas.classList.remove('hidden', 'wheel-spinning'); pointer.classList.remove('hidden'); const sliceAngle = 360 / state.slices; const stopAngle = (360 * 5) - (state.winSliceIndex * sliceAngle) - (sliceAngle / 2); canvas.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)'; canvas.style.transform = `rotate(${stopAngle}deg)`; } 
                else if (state.type === 'rps') { canvas.classList.add('hidden'); matchVisual.classList.remove('hidden', 'flipping'); matchVisual.innerText = '⚔️'; matchVisual.style.fontSize = '80px'; }
                else { canvas.classList.add('hidden'); matchVisual.classList.remove('hidden', 'flipping'); matchVisual.innerText = state.result ? state.result.charAt(0).toUpperCase() : '?'; }
                
                if(state.status === 'finished') { if(mySeatData && mySeatData.score >= state.format) playSfx('win'); else if (mySeatData) playSfx('lose'); }
            } else {
                if(state.type === 'wheel') { matchVisual.classList.add('hidden'); canvas.classList.remove('hidden', 'wheel-spinning'); canvas.style.transition = 'none'; canvas.style.transform = 'rotate(0deg)'; if(state.seats[0] && state.seats[1]) { drawWheel(canvas, state.slices, state.seats[0].username, state.seats[1].username); } else { drawWheel(canvas, state.slices, 'WAITING', 'WAITING'); } pointer.classList.remove('hidden'); } 
                else { canvas.classList.add('hidden'); matchVisual.classList.remove('hidden'); matchVisual.className = 'duel-coin'; matchVisual.innerText = '?'; matchVisual.style.fontSize = '60px'; pointer.classList.add('hidden'); }
            }
        });

        function drawWheel(canvas, numSlices, p1Name, p2Name) {
            if(!canvas.getContext) return; const ctx = canvas.getContext('2d'); const x = canvas.width / 2; const y = canvas.height / 2; const radius = x - 5;
            ctx.clearRect(0, 0, canvas.width, canvas.height); const sliceAngle = (2 * Math.PI) / numSlices; const colors = ['#ef4444', '#3b82f6']; 
            for (let i = 0; i < numSlices; i++) { const startAngle = i * sliceAngle - (Math.PI / 2); const endAngle = startAngle + sliceAngle; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, radius, startAngle, endAngle); ctx.closePath(); ctx.fillStyle = colors[i % 2]; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#0f172a'; ctx.stroke(); ctx.save(); ctx.translate(x, y); ctx.rotate(startAngle + (sliceAngle / 2)); ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial"; ctx.shadowColor = "black"; ctx.shadowBlur = 4; const text = i % 2 === 0 ? p1Name : p2Name; ctx.fillText(text.substring(0, 8), radius - 15, 6); ctx.restore(); }
            ctx.beginPath(); ctx.arc(x, y, 15, 0, 2 * Math.PI); ctx.fillStyle = '#fbbf24'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#b45309'; ctx.stroke();
        }

        // --- SECURITY ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
        });
    </script>
</body>
